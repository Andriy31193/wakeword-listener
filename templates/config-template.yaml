# Wake Word Listener Configuration

wake_word:
  model_path: "hey_dex.ppn"  # Path to wake word model file
  access_key: ""  # Picovoice access key
  sensitivity: 0.5

audio:
  sample_rate: 16000
  channels: 1
  frame_length: 512

recording:
  silence_timeout_secs: 2.0      # Stop recording after silence detected
  max_length_secs: 30.0          # Maximum recording duration
  vad_energy_threshold: 300      # VAD energy threshold for silence detection

mcp_client:
  enabled: true                  # Enable MCP client for context retrieval
  host: "127.0.0.1"
  port: 5001
  endpoint_retrieve_context: "/context"

stt:
  type: "local"                  # Transcription type: "local", "remote", or "groq"
  endpoint: ""                    # STT server endpoint (required if type is "remote")
  timeout: 30                     # Request timeout in seconds
  model: "base"                 # Whisper model size (tiny, base, small, medium, large) for local transcription
  device: "cpu"                  # Device for local transcription (cuda or cpu)
  groq_api_key: ""               # Groq API key (required if type is "groq")

n8n:
  webhook_url: ""  # n8n webhook URL

sounds:
  on_wakewordstart_sound_path: ""  # Path to sound file played when wake word is triggered (empty = no sound)
  on_wakewordend_sound_path: ""    # Path to sound file played when silence detected and transcription started (empty = no sound)

audio_api:
  enabled: true                    # Enable audio playback API server
  host: "127.0.0.1"               # API server host
  port: 5002                       # API server port

logging:
  level: "INFO"

